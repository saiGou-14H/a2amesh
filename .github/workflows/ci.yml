name: A2AMesh CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  UV_DEFAULT_INDEX: https://mirrors.aliyun.com/pypi/simple/

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      A2AMESH_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      A2AMESH_TEST_REDIS_DESTRUCTIVE: "1"
    services:
      redis:
        image: redis@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
        command: redis-server --save "" --appendonly no
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install locked test environment
        run: uv sync --locked --extra test --extra state
      - name: Run machine-readable gates
        run: >-
          uv run --locked --extra test --extra state python scripts/run_ci.py
          --report .ci-artifacts/ci-report.json
      - name: Upload CI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2amesh-ci-report
          path: .ci-artifacts/ci-report.json
          if-no-files-found: error

  chromium-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install locked browser environment
        run: uv sync --locked --extra test --extra browser-test
      - name: Install Chromium
        run: uv run --locked --extra browser-test playwright install --with-deps chromium
      - name: Run required browser gate
        env:
          A2AMESH_REQUIRE_BROWSER_GATE: "1"
        run: >-
          uv run --locked --extra test --extra browser-test pytest -q
          tests/test_architecture_browser_smoke.py
