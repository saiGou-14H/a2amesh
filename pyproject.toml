[project]
name = "a2amesh"
version = "0.1.0"
description = "Symmetric A2A agent mesh over NATS"
requires-python = ">=3.11"
dependencies = [
    "nats-py>=2.6.0",
    "pydantic>=2.6.0",
    "jsonschema>=4.21.0",
    "pyyaml>=6.0.0",
    "nkeys>=0.2.1",
    "pynacl>=1.5.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
a2amesh = "a2amesh.cli:main"
mesh = "a2amesh.runtime.cli_mesh:main"

[project.optional-dependencies]
gateway = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "a2a-sdk[grpc,http-server]==1.1.2",
]
mcp = ["mcp==2.0.0"]
state = ["redis[hiredis]==8.1.0"]
test = ["pytest", "pytest-asyncio", "httpx>=0.27.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"a2amesh.schemas" = ["*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017", "S101", "S110"]
