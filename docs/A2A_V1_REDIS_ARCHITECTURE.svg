<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600" role="img" aria-labelledby="title desc">
  <title id="title">A2AMesh v2 A2A v1.0 Redis NATS 目标架构</title>
  <desc id="desc">公网 Linux 提供标准 A2A Gateway、NATS、State Service 和私有 Redis；Linux 与两个 NAT 后 Windows Peer 全部主动连接 NATS。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#22d3ee"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#34d399"/></marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#fb923c"/></marker>
    <marker id="arrowViolet" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#a78bfa"/></marker>
    <style>
      .t{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#e2e8f0}.muted{fill:#94a3b8}.tiny{font-size:16px}.small{font-size:18px}.body{font-size:20px}.label{font-size:22px;font-weight:700}.node{font-size:25px;font-weight:800}.section{font-size:27px;font-weight:900}.title{font-size:40px;font-weight:900}.mono{font-family:'JetBrains Mono','Noto Sans Mono CJK SC',monospace}.flow{font-size:18px;font-weight:700}.chip{font-size:16px;font-weight:800;letter-spacing:.6px}
    </style>
  </defs>

  <rect width="2400" height="1600" fill="#020617"/>
  <rect width="2400" height="1600" fill="url(#grid)" opacity=".7"/>
  <circle cx="86" cy="76" r="10" fill="#34d399"/><circle cx="86" cy="76" r="22" fill="none" stroke="#34d399" opacity=".25"/>
  <text x="122" y="88" class="t title">A2AMesh v2｜完整 A2A v1.0 + Redis 状态平面</text>
  <text x="122" y="132" class="t body muted">标准协议边界与内部跨 NAT 数据面解耦 · Redis 不暴露公网 · 右侧能力均为目标设计，须通过官方 SDK 门禁</text>
  <rect x="1900" y="55" width="188" height="48" rx="24" fill="#052e2b" stroke="#34d399"/><text x="1994" y="86" class="t chip" fill="#6ee7b7" text-anchor="middle">A2A v1.0 TARGET</text>
  <rect x="2105" y="55" width="220" height="48" rx="24" fill="#172554" stroke="#60a5fa"/><text x="2215" y="86" class="t chip" fill="#bfdbfe" text-anchor="middle">1 Linux + 2 NAT Windows</text>

  <!-- Public Linux boundary -->
  <rect x="300" y="240" width="1800" height="760" rx="28" fill="#07111f" stroke="#fbbf24" stroke-width="3" stroke-dasharray="14 10"/>
  <rect x="330" y="216" width="365" height="52" rx="26" fill="#3b2604" stroke="#fbbf24"/>
  <text x="512" y="250" class="t label" fill="#fde68a" text-anchor="middle">公网 Linux｜唯一公网机器</text>
  <text x="2040" y="274" class="t small" fill="#fcd34d" text-anchor="end">443 HTTPS · 4222 NATS TLS/WSS</text>

  <!-- Connections first -->
  <path d="M255 430H405" fill="none" stroke="#22d3ee" stroke-width="5" marker-end="url(#arrowCyan)"/>
  <path d="M875 450H1000" fill="none" stroke="#34d399" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <path d="M1430 450H1530" fill="none" stroke="#a78bfa" stroke-width="5" marker-end="url(#arrowViolet)"/>
  <path d="M1215 575V705" fill="none" stroke="#fb923c" stroke-width="5" marker-end="url(#arrowOrange)"/>
  <path d="M1740 575V705" fill="none" stroke="#a78bfa" stroke-width="5" marker-end="url(#arrowViolet)"/>
  <path d="M1515 805H1355" fill="none" stroke="#a78bfa" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrowViolet)"/>
  <path d="M575 705V635Q575 600 610 600H1055Q1090 600 1090 575" fill="none" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrowCyan)"/>
  <!-- peer outbound paths -->
  <path d="M520 1125V1055Q520 1025 550 1025H1040Q1070 1025 1070 895" fill="none" stroke="#22d3ee" stroke-width="5" marker-end="url(#arrowCyan)"/>
  <path d="M1195 1125V1050Q1195 1020 1170 995L1140 965Q1110 935 1110 895" fill="none" stroke="#34d399" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <path d="M1880 1125V1040Q1880 1010 1850 1010H1270Q1230 1010 1230 895" fill="none" stroke="#34d399" stroke-width="5" marker-end="url(#arrowGreen)"/>

  <!-- External clients -->
  <rect x="70" y="330" width="185" height="200" rx="18" fill="#0f172a" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <text x="162" y="375" class="t node" text-anchor="middle">A2A Client</text>
  <text x="162" y="414" class="t small muted" text-anchor="middle">官方 SDK</text>
  <text x="162" y="447" class="t small muted" text-anchor="middle">JSON-RPC / SSE</text>
  <text x="162" y="480" class="t small muted" text-anchor="middle">A2A-Version: 1.0</text>
  <text x="285" y="414" class="t flow" fill="#67e8f9">标准 HTTPS</text>

  <!-- Gateway -->
  <rect x="405" y="330" width="470" height="245" rx="22" fill="#0f172a" stroke="#22d3ee" stroke-width="3" filter="url(#shadow)"/>
  <rect x="430" y="352" width="145" height="34" rx="17" fill="#083344"/><text x="502" y="375" class="t chip" fill="#67e8f9" text-anchor="middle">STANDARD EDGE</text>
  <text x="640" y="430" class="t node" text-anchor="middle">A2A Gateway</text>
  <text x="640" y="468" class="t small muted" text-anchor="middle">/.well-known/agent-card.json</text>
  <text x="640" y="501" class="t small muted" text-anchor="middle">JSONRPC / HTTPS + SSE</text>
  <text x="640" y="534" class="t small muted" text-anchor="middle">OAuth2 / mTLS · ETag · JWS Card</text>

  <!-- Application core -->
  <rect x="1000" y="330" width="430" height="245" rx="22" fill="#0f172a" stroke="#34d399" stroke-width="3" filter="url(#shadow)"/>
  <rect x="1025" y="352" width="156" height="34" rx="17" fill="#064e3b"/><text x="1103" y="375" class="t chip" fill="#6ee7b7" text-anchor="middle">CANONICAL CORE</text>
  <text x="1215" y="430" class="t node" text-anchor="middle">A2A Application Core</text>
  <text x="1215" y="468" class="t small muted" text-anchor="middle">11 个核心操作 · 官方 Proto/SDK 类型</text>
  <text x="1215" y="501" class="t small muted" text-anchor="middle">Task 状态机 · 权限 · 标准错误</text>
  <text x="1215" y="534" class="t small muted" text-anchor="middle">Binding-independent semantics</text>

  <!-- State service -->
  <rect x="1530" y="330" width="420" height="245" rx="22" fill="#0f172a" stroke="#a78bfa" stroke-width="3" filter="url(#shadow)"/>
  <rect x="1555" y="352" width="164" height="34" rx="17" fill="#2e1065"/><text x="1637" y="375" class="t chip" fill="#c4b5fd" text-anchor="middle">STATE SERVICE</text>
  <text x="1740" y="430" class="t node" text-anchor="middle">共享状态 API</text>
  <text x="1740" y="468" class="t small muted" text-anchor="middle">Card / Task / Context / Push Config</text>
  <text x="1740" y="501" class="t small muted" text-anchor="middle">幂等 · CAS · Lease · Rate Limit</text>
  <text x="1740" y="534" class="t small muted" text-anchor="middle">唯一 Redis Client</text>

  <!-- Card registry callout -->
  <rect x="405" y="705" width="330" height="185" rx="20" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
  <text x="570" y="752" class="t label" text-anchor="middle">标准 Agent Card</text>
  <text x="570" y="787" class="t small muted" text-anchor="middle">supportedInterfaces · tenant</text>
  <text x="570" y="820" class="t small muted" text-anchor="middle">skills · security · capabilities</text>
  <text x="570" y="853" class="t small muted" text-anchor="middle">public + extended + signatures</text>

  <!-- NATS -->
  <rect x="815" y="705" width="540" height="190" rx="24" fill="#0f172a" stroke="#fb923c" stroke-width="3" filter="url(#shadow)"/>
  <rect x="842" y="730" width="165" height="34" rx="17" fill="#431407"/><text x="925" y="753" class="t chip" fill="#fdba74" text-anchor="middle">DATA PLANE</text>
  <text x="1085" y="807" class="t node" text-anchor="middle">NATS + JetStream</text>
  <text x="1085" y="844" class="t small muted" text-anchor="middle">Request/Reply · 私有 Inbox · 有序事件/replay</text>
  <text x="1085" y="875" class="t tiny" fill="#fdba74" text-anchor="middle">https://a2amesh.dev/bindings/nats/v1</text>

  <!-- Redis -->
  <rect x="1515" y="705" width="455" height="190" rx="24" fill="#0f172a" stroke="#a78bfa" stroke-width="3" filter="url(#shadow)"/>
  <rect x="1542" y="730" width="170" height="34" rx="17" fill="#2e1065"/><text x="1627" y="753" class="t chip" fill="#c4b5fd" text-anchor="middle">PRIVATE STATE</text>
  <text x="1742" y="807" class="t node" text-anchor="middle">Redis</text>
  <text x="1742" y="844" class="t small muted" text-anchor="middle">Cards · Task snapshots · Indices</text>
  <text x="1742" y="875" class="t tiny" fill="#c4b5fd" text-anchor="middle">loopback / container network only · AOF</text>
  <text x="1435" y="790" class="t flow" fill="#c4b5fd" text-anchor="middle">event projection</text>

  <!-- Peer zones -->
  <rect x="180" y="1125" width="680" height="345" rx="24" fill="#071522" stroke="#38bdf8" stroke-width="2"/>
  <rect x="865" y="1125" width="660" height="345" rx="24" fill="#071a18" stroke="#34d399" stroke-width="2" stroke-dasharray="12 8"/>
  <rect x="1540" y="1125" width="680" height="345" rx="24" fill="#071a18" stroke="#34d399" stroke-width="2" stroke-dasharray="12 8"/>
  <text x="215" y="1165" class="t chip" fill="#7dd3fc">LINUX PEER</text>
  <text x="900" y="1165" class="t chip" fill="#6ee7b7">WINDOWS A · NAT</text>
  <text x="1575" y="1165" class="t chip" fill="#6ee7b7">WINDOWS B · NAT</text>

  <g>
    <rect x="235" y="1195" width="570" height="220" rx="18" fill="#0f172a" stroke="#38bdf8"/>
    <text x="520" y="1243" class="t node" text-anchor="middle">A2AMesh Peer</text>
    <text x="520" y="1283" class="t small muted" text-anchor="middle">Serve + Dispatch + Discover + Orchestrate</text>
    <rect x="285" y="1312" width="470" height="64" rx="14" fill="#082f49"/>
    <text x="520" y="1353" class="t body" fill="#bae6fd" text-anchor="middle">NATS v1 Binding · Executor · Adapter</text>
    <text x="520" y="1405" class="t small muted" text-anchor="middle">Hermes / Gateway-local Agent</text>
  </g>
  <g>
    <rect x="920" y="1195" width="550" height="220" rx="18" fill="#0f172a" stroke="#34d399"/>
    <text x="1195" y="1243" class="t node" text-anchor="middle">A2AMesh Peer</text>
    <text x="1195" y="1283" class="t small muted" text-anchor="middle">Serve + Dispatch + Discover + Orchestrate</text>
    <rect x="970" y="1312" width="450" height="64" rx="14" fill="#052e2b"/>
    <text x="1195" y="1353" class="t body" fill="#a7f3d0" text-anchor="middle">NATS v1 Binding · Executor · Adapter</text>
    <text x="1195" y="1405" class="t small muted" text-anchor="middle">Hermes / Codex · 零入站端口</text>
  </g>
  <g>
    <rect x="1595" y="1195" width="570" height="220" rx="18" fill="#0f172a" stroke="#34d399"/>
    <text x="1880" y="1243" class="t node" text-anchor="middle">A2AMesh Peer</text>
    <text x="1880" y="1283" class="t small muted" text-anchor="middle">Serve + Dispatch + Discover + Orchestrate</text>
    <rect x="1645" y="1312" width="470" height="64" rx="14" fill="#052e2b"/>
    <text x="1880" y="1353" class="t body" fill="#a7f3d0" text-anchor="middle">NATS v1 Binding · Executor · Adapter</text>
    <text x="1880" y="1405" class="t small muted" text-anchor="middle">Claude / OpenCode · 零入站端口</text>
  </g>

  <rect x="585" y="1065" width="220" height="42" rx="21" fill="#082f49" stroke="#0e7490"/>
  <text x="695" y="1093" class="t flow" fill="#67e8f9" text-anchor="middle">主动 TLS/WSS 长连接</text>
  <rect x="1270" y="1065" width="180" height="42" rx="21" fill="#052e2b" stroke="#047857"/>
  <text x="1360" y="1093" class="t flow" fill="#6ee7b7" text-anchor="middle">仅出网 TLS/WSS</text>
  <rect x="1955" y="1065" width="180" height="42" rx="21" fill="#052e2b" stroke="#047857"/>
  <text x="2045" y="1093" class="t flow" fill="#6ee7b7" text-anchor="middle">仅出网 TLS/WSS</text>

  <!-- Footer decision strip -->
  <rect x="180" y="1510" width="2040" height="58" rx="29" fill="#0f172a" stroke="#334155"/>
  <circle cx="222" cy="1539" r="10" fill="#22d3ee"/><text x="245" y="1547" class="t small">外部标准 A2A</text>
  <circle cx="520" cy="1539" r="10" fill="#fb923c"/><text x="543" y="1547" class="t small">内部 NATS 数据面</text>
  <circle cx="860" cy="1539" r="10" fill="#a78bfa"/><text x="883" y="1547" class="t small">Redis 共享状态</text>
  <circle cx="1175" cy="1539" r="10" fill="#34d399"/><text x="1198" y="1547" class="t small">Windows 零入站</text>
  <text x="2178" y="1547" class="t small muted" text-anchor="end">兼容声明门禁：official SDK → Gateway 全部核心操作</text>
</svg>
