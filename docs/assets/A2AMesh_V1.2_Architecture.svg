<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">A2AMesh V1.2 Architecture</title>
  <desc id="desc">Symmetric cross-NAT agent mesh with A2A JSON-RPC/gRPC, MCP bridge, canonical identity resolution, signed AuthContext, external OAuth authorization server, NATS data plane and Redis state.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#22d3ee"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#34d399"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#fb923c"/></marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#a78bfa"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#fb7185"/></marker>
    <style>
      text{font-family:"JetBrains Mono","Noto Sans CJK SC","Microsoft YaHei",monospace}
      .title{font-size:30px;font-weight:700;fill:#f8fafc}.subtitle{font-size:14px;fill:#94a3b8}
      .boundary-label{font-size:15px;font-weight:700}.name{font-size:16px;font-weight:700;fill:#f8fafc}.sub{font-size:12px;fill:#cbd5e1}.tiny{font-size:11px;fill:#aebad0}.flow{font-size:12px;font-weight:600}.badge{font-size:11px;font-weight:700}
    </style>
  </defs>

  <rect width="1600" height="1120" fill="#020617"/>
  <rect width="1600" height="1120" fill="url(#grid)" opacity="0.8"/>
  <circle cx="50" cy="47" r="7" fill="#22d3ee"/>
  <text id="title-text" x="70" y="58" class="title">A2AMesh V1.2 · Symmetric Agent Mesh</text>
  <text x="70" y="84" class="subtitle">A2A JSON-RPC/gRPC · MCP 2026-07-28 · Canonical Principal + signed AuthContext · external OAuth AS · no tenant/RBAC</text>

  <!-- Flow lines are drawn before components so boxes mask crossings. -->
  <path d="M520 135 H538" fill="none" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrow-cyan)"/>
  <text x="529" y="121" class="tiny" fill="#22d3ee" text-anchor="middle">call</text>
  <path d="M790 175 V190 H580 V244" fill="none" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrow-cyan)"/>
  <text x="690" y="187" class="tiny" fill="#22d3ee" text-anchor="middle">HTTPS :443</text>
  <path d="M1060 135 H1042" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrow-rose)"/>
  <text x="1051" y="121" class="tiny" fill="#fb7185" text-anchor="middle">MCP</text>
  <path d="M1310 135 H1292" fill="none" stroke="#fb7185" stroke-width="2.5" marker-end="url(#arrow-rose)"/>
  <text x="1301" y="121" class="tiny" fill="#fb7185" text-anchor="middle">token</text>
  <path d="M420 300 H362" fill="none" stroke="#fb7185" stroke-width="2.5" marker-end="url(#arrow-rose)"/>
  <path d="M360 340 H418" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="360" y="278" width="60" height="18" rx="5" fill="#020617"/>
  <text x="390" y="291" class="tiny" fill="#fb7185" text-anchor="middle">credential</text>
  <rect x="360" y="344" width="60" height="18" rx="5" fill="#020617"/>
  <text x="390" y="357" class="tiny" fill="#34d399" text-anchor="middle">principal</text>
  <path d="M740 315 H800" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="770" y="301" class="tiny" text-anchor="middle">principal + request</text>
  <path d="M1120 315 H1190" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow-violet)"/>
  <text x="1155" y="301" class="tiny" text-anchor="middle">state RPC</text>
  <path d="M1315 390 V468" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow-violet)"/>
  <text x="1330" y="435" class="tiny">private</text>
  <path d="M960 390 V488" fill="none" stroke="#fb923c" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="975" y="445" class="tiny">dispatch</text>
  <path d="M480 558 H372" fill="none" stroke="#fb923c" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <path d="M1020 558 H1045" fill="none" stroke="#fb923c" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <path d="M1165 520 Q1190 475 1240 390" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow-violet)"/>
  <text x="1190" y="470" class="tiny">project</text>
  <path d="M60 548 H28 V135 H30" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrow-rose)"/>
  <text x="40" y="455" class="tiny" fill="#fb7185">Push delivery</text>

  <!-- Every Peer initiates one outbound TLS/WSS session; the established channel is duplex. -->
  <path d="M270 813 V805 H610 V630" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="7,5" marker-end="url(#arrow-green)"/>
  <path d="M750 813 V630" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="7,5" marker-end="url(#arrow-green)"/>
  <path d="M1270 813 V805 H890 V630" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="7,5" marker-end="url(#arrow-green)"/>

  <!-- External components -->
  <g filter="url(#shadow)">
    <rect x="30" y="100" width="240" height="70" rx="10" fill="#0f172a" stroke="#fb7185" stroke-width="2"/>
    <text x="150" y="128" class="name" text-anchor="middle">Push Webhook Receiver</text>
    <text x="150" y="150" class="sub" text-anchor="middle">deliveryId · SSRF guard</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="290" y="100" width="230" height="70" rx="10" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <text x="405" y="128" class="name" text-anchor="middle">Official A2A Client</text>
    <text x="405" y="150" class="sub" text-anchor="middle">JSON-RPC / gRPC SDK</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="540" y="95" width="500" height="80" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
    <text x="790" y="124" class="name" text-anchor="middle">Public Virtual Hosts</text>
    <text x="790" y="147" class="sub" text-anchor="middle">A2A: &lt;agentId&gt;.agents.&lt;baseDomain&gt; · MCP: mcp.&lt;baseDomain&gt;/mcp</text>
    <text x="790" y="165" class="tiny" text-anchor="middle">Wildcard TLS · JSON-RPC/gRPC · Streamable HTTP · no tenant</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1060" y="100" width="230" height="70" rx="10" fill="#0f172a" stroke="#fb7185" stroke-width="2"/>
    <text x="1175" y="128" class="name" text-anchor="middle">MCP Client / Tool Host</text>
    <text x="1175" y="150" class="sub" text-anchor="middle">Streamable HTTP</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1310" y="100" width="250" height="70" rx="10" fill="#0f172a" stroke="#fb7185" stroke-width="2"/>
    <text x="1435" y="128" class="name" text-anchor="middle">External OAuth 2.1 AS</text>
    <text x="1435" y="150" class="sub" text-anchor="middle">issuer · client_credentials · JWKS</text>
  </g>

  <!-- Public Linux boundary -->
  <rect x="30" y="200" width="1540" height="510" rx="18" fill="rgba(120,53,15,0.07)" stroke="#fbbf24" stroke-width="2" stroke-dasharray="10,6"/>
  <text x="52" y="225" class="boundary-label" fill="#fbbf24">PUBLIC LINUX · only internet-facing machine · single Mesh · no tenant/RBAC · known V1 SPOF</text>

  <g filter="url(#shadow)">
    <rect x="60" y="245" width="300" height="145" rx="12" fill="#0f172a" stroke="#fb7185" stroke-width="2.5"/>
    <text x="210" y="273" class="name" text-anchor="middle">Identity Resolver</text>
    <text x="210" y="297" class="sub" text-anchor="middle">NKey · A2A Bearer · MCP OAuth</text>
    <text x="210" y="319" class="sub" text-anchor="middle">Credential + immutable Alias</text>
    <text x="210" y="341" class="sub" text-anchor="middle">Canonical Principal · signed AuthContext</text>
    <rect x="105" y="350" width="210" height="24" rx="12" fill="rgba(80,7,36,.55)" stroke="#fb7185"/>
    <text x="210" y="367" class="badge" fill="#fb7185" text-anchor="middle">IDENTITY ONLY · NO RBAC</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="420" y="245" width="320" height="145" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2.5"/>
    <text x="580" y="272" class="name" text-anchor="middle">Public Protocol Gateway</text>
    <text x="580" y="295" class="sub" text-anchor="middle">A2A: Card · JSON-RPC/SSE · gRPC</text>
    <text x="580" y="315" class="sub" text-anchor="middle">MCP: Streamable HTTP · tools/resources</text>
    <text x="580" y="335" class="sub" text-anchor="middle">Host routing · tenant reject · version</text>
    <rect x="470" y="347" width="220" height="28" rx="14" fill="rgba(8,51,68,.6)" stroke="#22d3ee"/>
    <text x="580" y="366" class="badge" fill="#22d3ee" text-anchor="middle">NORTH–SOUTH EDGE · NOT LEADER</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="800" y="245" width="320" height="145" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/>
    <text x="960" y="275" class="name" text-anchor="middle">A2A Application Core</text>
    <text x="960" y="300" class="sub" text-anchor="middle">11 operations · official objects</text>
    <text x="960" y="320" class="sub" text-anchor="middle">state machine · canonical principal · routing</text>
    <text x="960" y="342" class="sub" text-anchor="middle">MCP messageId dedupe · Task handle</text>
    <rect x="855" y="350" width="210" height="24" rx="12" fill="rgba(6,78,59,.55)" stroke="#34d399"/>
    <text x="960" y="367" class="badge" fill="#34d399" text-anchor="middle">TRANSPORT-INDEPENDENT</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1190" y="245" width="250" height="145" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="1315" y="275" class="name" text-anchor="middle">State Service</text>
    <text x="1315" y="300" class="sub" text-anchor="middle">Card upsert/get/list/search</text>
    <text x="1315" y="320" class="sub" text-anchor="middle">principal · credential · task · dedupe</text>
    <text x="1315" y="340" class="sub" text-anchor="middle">alias · lease · only Redis client</text>
    <rect x="1240" y="350" width="150" height="24" rx="12" fill="rgba(76,29,149,.6)" stroke="#a78bfa"/>
    <text x="1315" y="367" class="badge" fill="#a78bfa" text-anchor="middle">STATE AUTHORITY</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1190" y="470" width="250" height="130" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="1315" y="500" class="name" text-anchor="middle">Redis · Private</text>
    <text x="1315" y="525" class="sub" text-anchor="middle">Card/Agent index · Task snapshot</text>
    <text x="1315" y="545" class="sub" text-anchor="middle">Principal/Credential/Alias · message dedupe</text>
    <text x="1315" y="565" class="sub" text-anchor="middle">lease/fencing · Push · cursor · AOF</text>
    <text x="1315" y="585" class="tiny" text-anchor="middle">never exposed to Windows/public internet</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="480" y="490" width="540" height="135" rx="12" fill="#0f172a" stroke="#fb923c" stroke-width="2.5"/>
    <text x="750" y="520" class="name" text-anchor="middle">NATS + JetStream · A2A-over-NATS v1</text>
    <text x="750" y="545" class="sub" text-anchor="middle">RPC · private inbox · NKey/TLS · signed AuthContext</text>
    <text x="750" y="565" class="sub" text-anchor="middle">ordered Task events · durable consumers · bounded replay</text>
    <rect x="590" y="582" width="320" height="25" rx="12" fill="rgba(251,146,60,.22)" stroke="#fb923c"/>
    <text x="750" y="599" class="badge" fill="#fb923c" text-anchor="middle">EAST–WEST DATA PLANE · GATEWAY BYPASS</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="60" y="470" width="312" height="155" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/>
    <text x="216" y="500" class="name" text-anchor="middle">Progress Fan-out</text>
    <text x="216" y="526" class="sub" text-anchor="middle">SSE / SubscribeToTask</text>
    <text x="216" y="548" class="sub" text-anchor="middle">A2A Push Dispatcher + DLQ</text>
    <text x="216" y="570" class="sub" text-anchor="middle">rule-filtered Observer Agent</text>
    <text x="216" y="592" class="tiny" text-anchor="middle">one event source · independent consumers</text>
    <text x="216" y="610" class="tiny" text-anchor="middle">no raw chain-of-thought</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1045" y="515" width="120" height="85" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
    <text x="1105" y="545" class="name" font-size="13" text-anchor="middle">Projector</text>
    <text x="1105" y="567" class="tiny" text-anchor="middle">eventSeq CAS</text>
    <text x="1105" y="585" class="tiny" text-anchor="middle">snapshot update</text>
  </g>

  <rect x="350" y="660" width="860" height="32" rx="16" fill="rgba(6,78,59,.25)" stroke="#34d399"/>
  <text x="780" y="681" class="flow" fill="#34d399" text-anchor="middle">Each Peer dials out TLS/WSS · established session is duplex · no inbound listener · Gateway bypass</text>

  <!-- Peer boundary and peers -->
  <rect x="30" y="760" width="1540" height="285" rx="18" fill="rgba(6,78,59,0.05)" stroke="#34d399" stroke-width="2" stroke-dasharray="10,6"/>
  <text x="52" y="785" class="boundary-label" fill="#34d399">SYMMETRIC PEERS · no inbound A2A/MCP/Redis port on Windows</text>

  <g filter="url(#shadow)">
    <rect x="55" y="815" width="430" height="200" rx="14" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/>
    <text x="270" y="845" class="name" text-anchor="middle">Linux Peer</text>
    <text x="270" y="867" class="sub" text-anchor="middle">NKey identity · outbound NATS</text>
    <path d="M95 883 V870" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-green)"/>
    <text x="112" y="881" class="tiny" fill="#34d399">OUTBOUND DIAL ↑ · DUPLEX</text>
    <rect x="80" y="888" width="175" height="100" rx="9" fill="rgba(6,78,59,.35)" stroke="#34d399"/>
    <text x="168" y="916" class="name" font-size="13" text-anchor="middle">TaskSupervisor</text>
    <text x="168" y="938" class="tiny" text-anchor="middle">heartbeat · lease · cancel</text>
    <text x="168" y="958" class="tiny" text-anchor="middle">process watchdog</text>
    <rect x="275" y="888" width="180" height="100" rx="9" fill="rgba(8,51,68,.35)" stroke="#22d3ee"/>
    <text x="365" y="914" class="name" font-size="13" text-anchor="middle">Runtime Adapter</text>
    <text x="365" y="936" class="tiny" text-anchor="middle">Hermes / Codex</text>
    <text x="365" y="956" class="tiny" text-anchor="middle">Claude / OpenCode</text>
    <text x="365" y="976" class="tiny" text-anchor="middle">ToolRegistry · MCP Client</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="535" y="815" width="430" height="200" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-width="2.5"/>
    <text x="750" y="845" class="name" text-anchor="middle">Windows Peer A · NAT</text>
    <text x="750" y="867" class="sub" text-anchor="middle">NKey identity · outbound-only NATS</text>
    <path d="M575 883 V870" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-green)"/>
    <text x="592" y="881" class="tiny" fill="#34d399">OUTBOUND DIAL ↑ · DUPLEX</text>
    <rect x="560" y="888" width="175" height="100" rx="9" fill="rgba(6,78,59,.35)" stroke="#34d399"/>
    <text x="648" y="916" class="name" font-size="13" text-anchor="middle">TaskSupervisor</text>
    <text x="648" y="938" class="tiny" text-anchor="middle">heartbeat · lease · cancel</text>
    <text x="648" y="958" class="tiny" text-anchor="middle">process-tree watchdog</text>
    <rect x="755" y="888" width="180" height="100" rx="9" fill="rgba(8,51,68,.35)" stroke="#22d3ee"/>
    <text x="845" y="914" class="name" font-size="13" text-anchor="middle">Runtime Adapter</text>
    <text x="845" y="936" class="tiny" text-anchor="middle">Hermes / Codex</text>
    <text x="845" y="956" class="tiny" text-anchor="middle">Claude / OpenCode</text>
    <text x="845" y="976" class="tiny" text-anchor="middle">MCP Client · workspace safety</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1015" y="815" width="530" height="200" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-width="2.5"/>
    <text x="1280" y="845" class="name" text-anchor="middle">Windows Peer B · Separate NAT</text>
    <text x="1280" y="867" class="sub" text-anchor="middle">NKey identity · outbound-only NATS · independent network</text>
    <path d="M1060 883 V870" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-green)"/>
    <text x="1077" y="881" class="tiny" fill="#34d399">OUTBOUND DIAL ↑ · DUPLEX</text>
    <rect x="1045" y="888" width="205" height="100" rx="9" fill="rgba(6,78,59,.35)" stroke="#34d399"/>
    <text x="1148" y="916" class="name" font-size="13" text-anchor="middle">TaskSupervisor</text>
    <text x="1148" y="938" class="tiny" text-anchor="middle">heartbeat · lease · cancel</text>
    <text x="1148" y="958" class="tiny" text-anchor="middle">retry-safe takeover only</text>
    <rect x="1280" y="888" width="235" height="100" rx="9" fill="rgba(8,51,68,.35)" stroke="#22d3ee"/>
    <text x="1398" y="914" class="name" font-size="13" text-anchor="middle">Runtime Adapter</text>
    <text x="1398" y="936" class="tiny" text-anchor="middle">Hermes / Codex / Claude / OpenCode</text>
    <text x="1398" y="956" class="tiny" text-anchor="middle">Tool policy · workdir alias</text>
    <text x="1398" y="976" class="tiny" text-anchor="middle">MCP Client · no arbitrary shell</text>
  </g>

  <!-- Legend outside boundaries -->
  <g transform="translate(55 1072)">
    <rect width="18" height="12" rx="2" fill="#0f172a" stroke="#22d3ee"/><text x="25" y="11" class="tiny">A2A edge/interface</text>
    <rect x="190" width="18" height="12" rx="2" fill="#0f172a" stroke="#34d399"/><text x="215" y="11" class="tiny">application/runtime</text>
    <rect x="405" width="18" height="12" rx="2" fill="#0f172a" stroke="#fb923c"/><text x="430" y="11" class="tiny">NATS/event plane</text>
    <rect x="620" width="18" height="12" rx="2" fill="#0f172a" stroke="#a78bfa"/><text x="645" y="11" class="tiny">state plane</text>
    <rect x="800" width="18" height="12" rx="2" fill="#0f172a" stroke="#fb7185"/><text x="825" y="11" class="tiny">security/push boundary</text>
    <text x="1080" y="11" class="tiny">Design V1.2 · A2A v1.0.1 · MCP 2026-07-28</text>
  </g>
</svg>
