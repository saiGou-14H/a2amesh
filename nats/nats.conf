port: 4222
server_name: a2amesh
http: 8222

jetstream {
  store_dir: "/data"
  max_memory_store: 256MB
  max_file_store: 2GB
}

tls {
  cert_file: "/etc/nats/cert.pem"
  key_file:  "/etc/nats/key.pem"
}

# 每 agent 一个 NKey 用户；public key 用 nats/gen_test_keys.py 生成后填入。
# 注意：NKey 用户不能带 user/password 字段，NKey 本身即身份。
authorization {
  users = [
    { nkey: "U...", permissions: {
        subscribe: ["a2a.rpc.win1", "a2a.cards.win1", "a2a.stream.win1.>", "$SRV.>", "_INBOX.>"],
        publish:   ["a2a.rpc.*", "a2a.cards.*", "a2a.stream.win1.>", "$SRV.>", "_INBOX.>"]
    }},
    { nkey: "U...", permissions: {
        subscribe: ["a2a.rpc.win2", "a2a.cards.win2", "a2a.stream.win2.>", "$SRV.>", "_INBOX.>"],
        publish:   ["a2a.rpc.*", "a2a.cards.*", "a2a.stream.win2.>", "$SRV.>", "_INBOX.>"]
    }},
    { nkey: "U...", permissions: {
        subscribe: ["a2a.rpc.linux", "a2a.cards.linux", "a2a.stream.linux.>", "$SRV.>", "_INBOX.>"],
        publish:   ["a2a.rpc.*", "a2a.cards.*", "a2a.stream.linux.>", "$SRV.>", "_INBOX.>"]
    }}
  ]
}
