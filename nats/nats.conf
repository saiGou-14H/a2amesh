port: 4222
server_name: a2amesh
http: 8222

jetstream {
  store_dir: "/data"
  max_memory_store: 256MB
  max_file_store: 2GB
}

tls {
  cert_file: "/etc/nats/cert.pem"
  key_file:  "/etc/nats/key.pem"
}

# 每 agent 一个 user + NKey public key；ACL 见 docs/DESIGN.md §18
authorization {
  users = [
    { user: "win1", nkey: "U...", permissions: {
        subscribe: ["a2a.rpc.win1", "a2a.cards.win1", "$SRV.INFO", "_INBOX.>", "a2a.stream.win1.>"],
        publish:   ["a2a.stream.win1.>", "a2a.rpc.*", "a2a.cards.*", "$SRV.PING", "_INBOX.>",
                    "$KV.sess.win1.>", "$KV.mem.win1.>", "$KV.mem.shared.>"]
    }},
    { user: "win2", nkey: "U...", permissions: {
        subscribe: ["a2a.rpc.win2", "a2a.cards.win2", "$SRV.INFO", "_INBOX.>", "a2a.stream.win2.>"],
        publish:   ["a2a.stream.win2.>", "a2a.rpc.*", "a2a.cards.*", "$SRV.PING", "_INBOX.>",
                    "$KV.sess.win2.>", "$KV.mem.win2.>", "$KV.mem.shared.>"]
    }},
    { user: "linux", nkey: "U...", permissions: {
        subscribe: ["a2a.rpc.linux", "a2a.cards.linux", "$SRV.INFO", "_INBOX.>", "a2a.stream.linux.>"],
        publish:   ["a2a.stream.linux.>", "a2a.rpc.*", "a2a.cards.*", "$SRV.PING", "_INBOX.>",
                    "$KV.sess.linux.>", "$KV.mem.linux.>", "$KV.mem.shared.>"]
    }}
  ]
}
