port: 4222
server_name: a2amesh
http: "127.0.0.1:8222"

jetstream {
  store_dir: "/data"
  max_memory_store: 256MB
  max_file_store: 2GB
}

tls {
  cert_file: "/etc/nats/cert.pem"
  key_file:  "/etc/nats/key.pem"
}

# 每 agent 一个 NKey 用户；public key 用 nats/gen_test_keys.py 生成后填入。
# KV API 按精确 Stream 名授权，禁止使用可管理任意 Stream 的 $JS.API.>。
authorization {
  users = [
    { nkey: "U...", permissions: {
        subscribe: ["a2a.rpc.win1", "a2a.cards.win1", "$SRV.>", "_INBOX.win1.>"]
        publish: [
          "a2a.rpc.*", "a2a.cards.*", "$SRV.>", "a2a.dlq.win1",
          "$KV.A2AMESH_SESS_win1.>", "$KV.A2AMESH_MEM_win1.>",
          "$KV.A2AMESH_MEM_SHARED.>",
          "$JS.API.STREAM.INFO.KV_A2AMESH_SESS_win1",
          "$JS.API.STREAM.CREATE.KV_A2AMESH_SESS_win1",
          "$JS.API.DIRECT.GET.KV_A2AMESH_SESS_win1",
          "$JS.API.STREAM.MSG.GET.KV_A2AMESH_SESS_win1",
          "$JS.API.STREAM.MSG.DELETE.KV_A2AMESH_SESS_win1",
          "$JS.API.STREAM.INFO.KV_A2AMESH_MEM_win1",
          "$JS.API.STREAM.CREATE.KV_A2AMESH_MEM_win1",
          "$JS.API.DIRECT.GET.KV_A2AMESH_MEM_win1",
          "$JS.API.STREAM.MSG.GET.KV_A2AMESH_MEM_win1",
          "$JS.API.STREAM.MSG.DELETE.KV_A2AMESH_MEM_win1",
          "$JS.API.STREAM.INFO.KV_A2AMESH_MEM_SHARED",
          "$JS.API.STREAM.CREATE.KV_A2AMESH_MEM_SHARED",
          "$JS.API.DIRECT.GET.KV_A2AMESH_MEM_SHARED",
          "$JS.API.STREAM.MSG.GET.KV_A2AMESH_MEM_SHARED",
          "$JS.API.STREAM.MSG.DELETE.KV_A2AMESH_MEM_SHARED"
        ]
        allow_responses: { max: -1, expires: "10m" }
    }},
    { nkey: "U...", permissions: {
        subscribe: ["a2a.rpc.win2", "a2a.cards.win2", "$SRV.>", "_INBOX.win2.>"]
        publish: [
          "a2a.rpc.*", "a2a.cards.*", "$SRV.>", "a2a.dlq.win2",
          "$KV.A2AMESH_SESS_win2.>", "$KV.A2AMESH_MEM_win2.>",
          "$KV.A2AMESH_MEM_SHARED.>",
          "$JS.API.STREAM.INFO.KV_A2AMESH_SESS_win2",
          "$JS.API.STREAM.CREATE.KV_A2AMESH_SESS_win2",
          "$JS.API.DIRECT.GET.KV_A2AMESH_SESS_win2",
          "$JS.API.STREAM.MSG.GET.KV_A2AMESH_SESS_win2",
          "$JS.API.STREAM.MSG.DELETE.KV_A2AMESH_SESS_win2",
          "$JS.API.STREAM.INFO.KV_A2AMESH_MEM_win2",
          "$JS.API.STREAM.CREATE.KV_A2AMESH_MEM_win2",
          "$JS.API.DIRECT.GET.KV_A2AMESH_MEM_win2",
          "$JS.API.STREAM.MSG.GET.KV_A2AMESH_MEM_win2",
          "$JS.API.STREAM.MSG.DELETE.KV_A2AMESH_MEM_win2",
          "$JS.API.STREAM.INFO.KV_A2AMESH_MEM_SHARED",
          "$JS.API.STREAM.CREATE.KV_A2AMESH_MEM_SHARED",
          "$JS.API.DIRECT.GET.KV_A2AMESH_MEM_SHARED",
          "$JS.API.STREAM.MSG.GET.KV_A2AMESH_MEM_SHARED",
          "$JS.API.STREAM.MSG.DELETE.KV_A2AMESH_MEM_SHARED"
        ]
        allow_responses: { max: -1, expires: "10m" }
    }},
    { nkey: "U...", permissions: {
        subscribe: ["a2a.rpc.linux", "a2a.cards.linux", "$SRV.>", "_INBOX.linux.>"]
        publish: [
          "a2a.rpc.*", "a2a.cards.*", "$SRV.>", "a2a.dlq.linux",
          "$KV.A2AMESH_SESS_linux.>", "$KV.A2AMESH_MEM_linux.>",
          "$KV.A2AMESH_MEM_SHARED.>",
          "$JS.API.STREAM.INFO.KV_A2AMESH_SESS_linux",
          "$JS.API.STREAM.CREATE.KV_A2AMESH_SESS_linux",
          "$JS.API.DIRECT.GET.KV_A2AMESH_SESS_linux",
          "$JS.API.STREAM.MSG.GET.KV_A2AMESH_SESS_linux",
          "$JS.API.STREAM.MSG.DELETE.KV_A2AMESH_SESS_linux",
          "$JS.API.STREAM.INFO.KV_A2AMESH_MEM_linux",
          "$JS.API.STREAM.CREATE.KV_A2AMESH_MEM_linux",
          "$JS.API.DIRECT.GET.KV_A2AMESH_MEM_linux",
          "$JS.API.STREAM.MSG.GET.KV_A2AMESH_MEM_linux",
          "$JS.API.STREAM.MSG.DELETE.KV_A2AMESH_MEM_linux",
          "$JS.API.STREAM.INFO.KV_A2AMESH_MEM_SHARED",
          "$JS.API.STREAM.CREATE.KV_A2AMESH_MEM_SHARED",
          "$JS.API.DIRECT.GET.KV_A2AMESH_MEM_SHARED",
          "$JS.API.STREAM.MSG.GET.KV_A2AMESH_MEM_SHARED",
          "$JS.API.STREAM.MSG.DELETE.KV_A2AMESH_MEM_SHARED"
        ]
        allow_responses: { max: -1, expires: "10m" }
    }}
  ]
}
